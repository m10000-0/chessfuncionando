<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Windows Security</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,sans-serif;user-select:none}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;cursor:default}

.popup{position:fixed;width:420px;background:#f0f0f0;border:1px solid #999;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:10;color:#1a1a1a;opacity:0;transform:scale(.95);transition:opacity .25s,transform .25s;font-size:12px}
.popup.show{opacity:1;transform:scale(1)}

.popup .titlebar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#fff;font-size:11px;font-weight:400;color:#333;cursor:move;border-bottom:1px solid #ddd}
.popup .titlebar img{width:14px;height:14px}
.popup .titlebar .wbtns{margin-left:auto;display:flex;gap:0}
.popup .titlebar .wbtn{width:36px;height:26px;border:none;background:transparent;font-size:13px;cursor:pointer;color:#333;display:flex;align-items:center;justify-content:center}
.popup .titlebar .wbtn:hover{background:#e5e5e5}
.popup .titlebar .wbtn.red:hover{background:#c42b1c;color:#fff}

.popup .content{padding:20px 24px;display:flex;gap:16px;align-items:flex-start}
.popup .content .shield{font-size:36px;flex-shrink:0}
.popup .content .text{font-size:12px;line-height:1.5;color:#1a1a1a}
.popup .content .text b{font-size:12px}
.popup .content .text .warn{color:#c00;font-weight:600}
.popup .content .text .gray{color:#666;font-size:11px}

.popup .footer{padding:8px 24px 14px;text-align:right;background:#f0f0f0;border-top:1px solid #ddd}
.popup .footer button{background:#0067c0;color:#fff;border:1px solid #0053a1;padding:5px 24px;font-size:12px;cursor:pointer;min-width:80px}
.popup .footer button:hover{background:#0053a1}
.popup .footer button.sec{background:#e1e1e1;color:#1a1a1a;border:1px solid #adadad;margin-right:6px}
.popup .footer button.sec:hover{background:#ccc}
</style>
</head>
<body>
<img id="bg" src="prank-bg.gif" alt="">
<script src="prank-script.js"></script>
</body>
</html>
